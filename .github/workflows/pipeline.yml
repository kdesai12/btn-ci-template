# Pipeline source of truth: this file in kdesai12/btn-ci-template.
# Synced from btn-bedrock main `.github/workflows/pipeline.yml`; callers pin this workflow by full SHA.
# Pins bootstrapped 2026-10-27 (template bootstrap per D10); Dependabot maintains them from here.
# Stages: path-filter -> test -> build -> Trivy scan -> push GHCR by digest -> (promotion: cosign sign + SBOM)
name: pipeline
on:
  workflow_call:
    inputs:
      image:
        description: "Full image ref, e.g. ghcr.io/<owner>/<app>"
        required: true
        type: string
      context:
        description: "Build context directory"
        required: false
        default: "."
        type: string
      runner:
        description: "hosted | fedora-data (JIT; private repos, push/dispatch events only)"
        required: false
        default: "hosted"
        type: string
      promote:
        description: "Sign the digest with cosign and attach the SBOM (release jobs)"
        required: false
        default: false
        type: boolean
      trivy_gate:
        description: "report (default; scan never fails the build) | enforce (fail on HIGH/CRITICAL fixable). Enforcement is a Kishan policy gate (D10 note, 2026-10-27) - do not default to enforce."
        required: false
        default: "report"
        type: string
    outputs:
      digest:
        description: "sha256 digest of the built image"
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read
  packages: write
  id-token: write # OIDC: GHCR + cosign keyless; no stored long-lived secrets (D8/D6)
  # paths-filter lists the PR's changed files via the API on pull_request
  # events; without this the changes job 403s ("Resource not accessible by
  # integration").
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # pin created by template bootstrap; Dependabot maintains
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            build:
              - '**'
              - '!**.md'
              - '!docs/**'

  test:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ inputs.runner == 'fedora-data' && fromJSON('["self-hosted","linux","x64","fedora-data"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space (ubuntu-latest has ~14G free; the full test
          build needs ~37G — drop preinstalled toolchains the build never uses)
        if: inputs.runner == 'hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache \
            /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h
      - name: Restore cargo cache for fork PRs (restore-only, no save from untrusted code)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Cache cargo registry + target
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true) }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install protoc (prost-build needs it for lance-encoding;
          ubuntu-latest lacks it; the fedora-data runner already has it)
        if: inputs.runner == 'hosted'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Run repo test command
        run: ./scripts/ci-test.sh # each repo provides this; template owns everything else

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          push: true
          tags: ${{ inputs.image }}:sha-${{ github.sha }}
      - name: Trivy scan (image; report-only unless trivy_gate=enforce)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.image }}@${{ steps.build.outputs.digest }}
          version: "v0.76.1"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          format: "json"
          output: "trivy-image-report.json"
          exit-code: ${{ inputs.trivy_gate == 'enforce' && '1' || '0' }}
      - name: Upload Trivy image report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-image-report-${{ github.sha }}
          path: trivy-image-report.json
          if-no-files-found: ignore
      - name: SBOM (Syft, SPDX)
        if: inputs.promote
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ inputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Cosign sign digest (keyless via OIDC)
        if: inputs.promote
        run: cosign sign --yes ${{ inputs.image }}@${{ steps.build.outputs.digest }}
